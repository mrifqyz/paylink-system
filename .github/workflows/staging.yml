name: Staging CI/CD

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paylink-system
          path: target/paylink-system-0.0.1-SNAPSHOT.jar

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: paylink-system
          path: target

      - name: Test
        run: mvn -B verify --file pom.xml

  deploy-staging:
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: [self-hosted, mrifqyz]
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Liquibase Migrations
        run: |-
          mvn -e liquibase:update \
            -Dliquibase.url="${{ secrets.DB_URL_STAGING }}" \
            -Dliquibase.username="${{ secrets.DB_USERNAME_STAGING }}" \
            -Dliquibase.password="${{ secrets.DB_PASSWORD_STAGING }}" \
            -Dliquibase.changeLogFile=db/master.changelog.yaml \
            -Dliquibase.driver=org.postgresql.Driver \
            -Dliquibase.searchPath=src/main/resources

      - name: Build Docker image
        run: |-
          docker build -t paylink-system-staging:latest \
            -t paylink-system-staging:${{ github.sha }} .

      - name: Save and import image to k3s
        run: |-
          docker save paylink-system-staging:latest -o /tmp/paylink-system-staging.tar
          ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import /tmp/paylink-system-staging.tar
          rm -f /tmp/paylink-system-staging.tar

      - name: Apply Kubernetes namespace
        run: |-
          kubectl apply -f k8s/staging/namespace.yml

      - name: Create Kubernetes secrets
        run: |-
          envsubst < k8s/staging/secret.yml | kubectl apply -f -
        env:
          DB_URL_STAGING: ${{ secrets.DB_URL_STAGING }}
          DB_USERNAME_STAGING: ${{ secrets.DB_USERNAME_STAGING }}
          DB_PASSWORD_STAGING: ${{ secrets.DB_PASSWORD_STAGING }}
          JWT_SECRET_STAGING: ${{ secrets.JWT_SECRET_STAGING }}
          REDIS_PASSWORD_STAGING: ${{ secrets.REDIS_PASSWORD_STAGING }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          AES_KEY_STAGING: ${{ secrets.AES_KEY_STAGING }}
          AES_IV_STAGING: ${{ secrets.AES_IV_STAGING }}

      - name: Create Kubernetes ConfigMap
        run: |-
          envsubst < k8s/staging/configmap.yml | kubectl apply -f -
        env:
          ALLOWED_URL_STAGING: ${{ secrets.ALLOWED_URL_STAGING }}
          REDIS_HOST_STAGING: ${{ secrets.REDIS_HOST_STAGING }}
          REDIS_PORT_STAGING: ${{ secrets.REDIS_PORT_STAGING }}

      - name: Apply Kubernetes manifests
        run: |-
          kubectl apply -f k8s/staging/deployment.yml
          kubectl apply -f k8s/staging/service.yml
          envsubst < k8s/staging/ingress.yml | kubectl apply -f -
        env:
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}

      - name: Restart deployment to pull new image
        run: |-
          kubectl rollout restart deployment/paylink-system-staging -n paylink-staging

      - name: Wait for deployment to be ready
        run: |-
          kubectl rollout status deployment/paylink-system-staging -n paylink-staging --timeout=5m

      - name: Verify deployment health
        run: |-
          echo "Checking pod status..."
          kubectl get pods -n paylink-staging -l app=paylink-system

          echo "Waiting for application to be healthy..."
          for i in {1..30}; do
            POD_NAME=$(kubectl get pods -n paylink-staging -l app=paylink-system -o jsonpath='{.items[0].metadata.name}')
            if kubectl exec -n paylink-staging $POD_NAME -- wget --spider -q http://localhost:8080/actuator/health; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Attempt $i: Application not ready yet..."
            sleep 5
          done
          echo "Application failed to start in time"
          kubectl logs -n paylink-staging -l app=paylink-system --tail=100
          exit 1

      - name: Cleanup old Docker images
        run: |-
          docker image prune -af --filter "label!=keep" --filter "until=24h" || true