apiVersion: v1
kind: Service
metadata:
  name: paylink-system-staging
  namespace: paylink-staging
  labels:
    app: paylink-system
    environment: staging
spec:
  type: ClusterIP
  selector:
    app: paylink-system
    environment: staging
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP