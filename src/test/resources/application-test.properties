# Test Environment Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=JSONB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect.storage_engine=json
spring.jpa.properties.hibernate.type.preferred_json_type=BINARY

# Disable Google Cloud Pub/Sub in tests
spring.cloud.gcp.pubsub.enabled=false
spring.autoconfigure.exclude=com.google.cloud.spring.autoconfigure.pubsub.GcpPubSubAutoConfiguration

# Disable Redis in tests
spring.data.redis.repositories.enabled=false
spring.cache.type=none
